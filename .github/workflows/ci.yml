name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compilar:
    name: compilar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Só apanha erros de sintaxe: não instala dependências nem corre o backend.
      - name: python -m compileall
        run: python -m compileall -q app benchmarks scripts tests tools
